name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e . 'agentenv-framework>=0.9.1637' pytest
      - name: Unit tests
        run: .venv/bin/python -m pytest -q tests
      - name: Integration test (the server image against a plain MCP server)
        run: PATH=$PWD/.venv/bin:$PATH tests/integration/run.sh
