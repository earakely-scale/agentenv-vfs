[project]
name = "agentenv-vfs"
version = "0.4.0"
description = "agent-env plugin: any env's MCP tools as shell commands in a Mirage workspace (agentvfs)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["agentenv-framework>=0.9.1637", "click>=8"]

[project.entry-points."agent_env.envs"]
agentvfs = "agentenv_vfs.env:AgentVfsEnv"

[project.entry-points."agent_env.cli_plugins"]
vfs = "agentenv_vfs.cli:vfs"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_vfs"]
exclude = ["src/agentenv_vfs/server/node_modules"]
